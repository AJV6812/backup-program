[package]
name = "backup"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_millis = "0.1.1"
serde_derive = "1.0"
time = {version="0.3", features=["formatting","local-offset"]}
rand = "0.10.3"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
git2 = "0.21.0"
crossterm = "0.29.0"
anyhow = "1.0.104"
terminal_size = "0.4.4"
millisecond = "0.15.14"

[dependencies.uuid]
version = "1.26.1"
features = [
    "v4",
    "serde",
]

