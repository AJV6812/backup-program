[package]
name = "backup"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_millis = "0.1.1"
serde_derive = "1.0"
time = {version="0.3", features=["formatting","local-offset"]}

[dependencies.uuid]
version = "1.26.1"
features = [
    "v4",
    "serde",
]

